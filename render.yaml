services:
  - type: web
    name: lucky-bingo-pro
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 40 --timeout 120 --keep-alive 65
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: BINGO_VOICE
        value: fil-PH-AngeloNeural
